name: Evidence Lane CodeQL hosted organization upload

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-lane-codeql-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.repository_owner == 'Evidence-Lane'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout exact organization mirror commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: python,javascript-typescript
          queries: security-extended
      - name: Analyze and upload to organization Code Security
        uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          category: /language:python-and-javascript-typescript
          upload: always
          upload-database: false
