name: Evidence Lane preview build

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: evidence-lane-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact study commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: plugins/evidence-lane-plugin/remote_adapter/pnpm-lock.yaml
      - name: Install preview dependencies
        run: pnpm --dir plugins/evidence-lane-plugin/remote_adapter install --frozen-lockfile
      - name: Execute preview build contract
        uses: ./.github/actions/evidence-lane-ci
        with:
          profile: preview-build
          receipt_path: .runtime/ci/preview-build-receipt.json
      - name: Upload preview build receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-lane-preview-build-receipt
          path: .runtime/ci/preview-build-receipt.json
          if-no-files-found: error
          retention-days: 7
