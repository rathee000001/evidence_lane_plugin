name: Evidence Lane governed CI adapter
description: Run one fixed Code-mode CI profile and emit a sealed execution receipt.
inputs:
  profile:
    description: Fixed bounded profile from the governed quality, lifecycle, lane, source, smoke, or preview set.
    required: true
  python_executable:
    description: Python executable path used by the fixed Python profiles.
    required: false
    default: python
  pnpm_executable:
    description: pnpm executable path used by the fixed preview profile.
    required: false
    default: pnpm
  receipt_path:
    description: Workspace-relative JSON receipt path.
    required: false
    default: .runtime/ci/evidence-lane-ci-receipt.json
outputs:
  status:
    description: PASS or BLOCKED.
  receipt_sha256:
    description: Canonical SHA-256 of the receipt body.
  receipt_path:
    description: Workspace-relative receipt path.
runs:
  using: node24
  main: src/main.mjs
