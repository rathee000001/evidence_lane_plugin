[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-lane-plugin"
version = "4.0.3"
description = "Local project state and verified sequential work for Codex."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE.md"]
dependencies = ["pydantic==2.13.4", "mcp==1.28.1", "httpx==0.28.1", "defusedxml==0.7.1", "uvicorn==0.52.4", "langgraph==1.2.11", "langchain-core==1.6.1", "graphviz==0.21", "jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.4", "PyYAML==6.0.3", "mypy==2.3.1"]

[project.scripts]
evidence-lane = "evidence_lane_plugin.cli:main"
evidence-lane-engine = "evidence_lane_plugin.service:main"
evidence-lane-recovery = "evidence_lane_plugin.database_recovery:recovery_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidence_lane_plugin = ["migrations/*.sql", "studio/*", "studio/assets/*", "contracts/*.json", "native/*.java", "contracts/powerbi-schemas/*.json", "contracts/powerbi-schemas/LICENSE.txt"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
no_site_packages = true
cache_dir = "../../.work/mypy-package"
files = ["src/evidence_lane_plugin"]
