name: Evidence Lane CodeQL

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: evidence-lane-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact study commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: python,javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:python-and-javascript-typescript
          output: .runtime/codeql/results
          post-processed-sarif-path: .runtime/codeql/processed
          upload: never
          upload-database: false
      - name: Upload local CodeQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-lane-codeql-sarif
          path: |
            .runtime/codeql/results
            .runtime/codeql/processed
          if-no-files-found: error
          retention-days: 7
