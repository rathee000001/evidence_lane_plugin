name: Evidence Lane CodeQL

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/**"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: evidence-lane-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact study commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: python,javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          category: /language:python-and-javascript-typescript
