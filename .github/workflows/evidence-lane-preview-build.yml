name: Evidence Lane candidate preview

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: evidence-lane-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Install hash-locked repository dependencies
        shell: pwsh
        run: |
          python -B -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: apps/evidence-lane-studio/package-lock.json
      - name: Install Studio dependencies
        shell: pwsh
        run: |
          npm ci --prefix apps/evidence-lane-studio --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run current package regression profile
        uses: ./.github/actions/evidence-lane-ci
        with:
          profile: package
          python_executable: python
      - name: Build current local Studio
        shell: pwsh
        run: |
          python -B scripts/build_studio.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload candidate preview receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-lane-candidate-preview-receipt
          path: |
            .work/ci/package/receipt.json
            .work/ci/package/pytest.xml
            plugins/evidence-lane-plugin/src/evidence_lane_plugin/studio/assets-manifest.json
          if-no-files-found: error
          retention-days: 7
