name: Evidence Lane governed Python CI

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: evidence-lane-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile:
          - governed-quality
          - governed-lifecycle
          - governed-lanes
          - governed-sources-mcp
    steps:
      - name: Checkout exact study commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The semantic fingerprint keeps the immutable cumulative main
          # baseline even after bounded correction and receipt commits.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            plugins/evidence-lane-plugin/requirements.torch-cpu.lock.txt
            plugins/evidence-lane-plugin/requirements.lock.txt
      - name: Install governed Python dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r plugins/evidence-lane-plugin/requirements.torch-cpu.lock.txt
          python -m pip install --require-hashes -r plugins/evidence-lane-plugin/requirements.lock.txt
      - name: Execute Code-mode CI contract
        uses: ./.github/actions/evidence-lane-ci
        with:
          profile: ${{ matrix.profile }}
          receipt_path: .runtime/ci/${{ matrix.profile }}-receipt.json
      - name: Upload CI receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-lane-${{ matrix.profile }}-receipt
          path: .runtime/ci/${{ matrix.profile }}-receipt.json
          if-no-files-found: error
          retention-days: 7
