name: Evidence Lane GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/evi-v300-systemwide-release-hil-v3.0.0
    paths:
      - README.md
      - CONTRIBUTING.md
      - ARCHITECTURE.md
      - LICENSE.md
      - SECURITY.md
      - docs/**
      - github-pages/**
      - scripts/prepare_github_pages.py
      - .github/workflows/evidence-lane-github-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evidence-lane-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact documentation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Project Git-tracked authorities into GitHub Pages
        run: python scripts/prepare_github_pages.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build GitHub Pages with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./.github-pages-build
          destination: ./_site
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
