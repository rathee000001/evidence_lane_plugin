name: Evidence Lane repository CI
description: Run one explicit maintainer regression profile; no user-project configuration or installation.
inputs:
  profile:
    description: Exact profile from .github/maintainer-ci.v4.json.
    required: true
  python_executable:
    description: Python 3.14 executable selected by the repository workflow.
    required: false
    default: python
outputs:
  status:
    description: passed, failed or blocked for the selected regression profile.
  receipt_sha256:
    description: SHA-256 of the measured result file, not an approval or native attestation.
  receipt_path:
    description: Repository-relative result path under .work/ci.
runs:
  using: node24
  main: src/main.mjs
