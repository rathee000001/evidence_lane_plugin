[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-lane-plugin"
version = "4.0.1"
description = "Local project state and verified sequential work for Codex."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE.md"]
dependencies = ["pydantic==2.13.4", "mcp==1.28.1", "httpx==0.28.1", "defusedxml==0.7.1", "uvicorn==0.52.4", "langgraph==1.2.11", "langchain-core==1.6.1", "graphviz==0.21", "jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.4", "PyYAML==6.0.3", "llama-index-core==0.14.23", "rank-bm25==0.2.2", "python-docx==1.2.0", "python-pptx==1.0.2", "openpyxl==3.1.5", "python-calamine==0.8.2", "pyarrow==25.0.0", "pandas==3.0.5", "polars==1.44.1", "duckdb==1.5.5", "tableauhyperapi==0.0.26359", "rustworkx==0.18.1", "ddgs==9.16.0", "trafilatura==2.2.0", "readability-lxml==0.8.4.1", "beautifulsoup4==4.15.0", "markdownify==1.2.3", "html2text==2025.4.15", "validators==0.35.0", "tldextract==5.3.2", "mypy==2.3.1"]

[project.scripts]
evidence-lane = "evidence_lane_plugin.cli:main"
evidence-lane-engine = "evidence_lane_plugin.service:main"
evidence-lane-recovery = "evidence_lane_plugin.database_recovery:recovery_main"

[tool.setuptools]
package-dir = {"" = "plugins/evidence-lane-plugin/src"}

[tool.setuptools.packages.find]
where = ["plugins/evidence-lane-plugin/src"]

[tool.setuptools.package-data]
evidence_lane_plugin = ["migrations/*.sql", "studio/*", "studio/assets/*", "contracts/*.json", "contracts/powerbi-schemas/*.json", "contracts/powerbi-schemas/LICENSE.txt"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["plugins/evidence-lane-plugin/src"]
testpaths = [
  "tests/test_maintainer_ci_v4.py",
  "tests/test_registry.py",
  "tests/test_engine.py",
  "tests/test_workers.py",
  "tests/test_jobs.py",
