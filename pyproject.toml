[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
no_site_packages = true
cache_dir = ".work/mypy"
files = ["plugins/evidence-lane-plugin/src/evidence_lane_plugin"]
