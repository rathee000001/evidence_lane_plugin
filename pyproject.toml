[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-lane-plugin"
version = "0.1.0"
description = "Private stateful agentic-code plugin with deterministic SQLite project versions and human HIL promotion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Praveen Rathee" }]
dependencies = [
  "cryptography==48.0.1",
  "httpx==0.28.1",
  "mcp==1.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[project.scripts]
evidence-lane-plugin = "evidence_lane_plugin.cli:main"

[tool.setuptools]
package-dir = {"" = "plugins/evidence-lane-plugin/src"}

[tool.setuptools.packages.find]
where = ["plugins/evidence-lane-plugin/src"]

[tool.setuptools.package-data]
evidence_lane_plugin = ["schema.sql"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["plugins/evidence-lane-plugin/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["plugins/evidence-lane-plugin/src/evidence_lane_plugin"]
