[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-lane-plugin"
version = "0.8.0"
description = "Private six-control Evidence Lane plugin with detachable Boot, universal SQLite brains, candidate overlays, and exact-APPROVE HIL."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Praveen Rathee" }]
dependencies = [
  "cryptography==48.0.1",
  "defusedxml==0.7.1",
  "httpx==0.28.1",
  "mcp==1.28.1",
  "onnxruntime==1.28.0",
  "openpyxl==3.1.5",
  "pandas==3.0.5",
  "pdfplumber==0.11.10",
  "Pillow==12.3.0",
  "pyarrow==25.0.0",
  "PyJWT[crypto]==2.13.0",
  "PyMuPDF==1.28.0",
  "pypdf==6.14.2",
  "pytesseract==0.3.13",
  "pywin32==312; sys_platform == 'win32'",
  "python-calamine==0.8.2",
  "rapidocr==3.9.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[project.scripts]
evidence-lane-plugin = "evidence_lane_plugin.cli:main"

[tool.setuptools]
package-dir = {"" = "plugins/evidence-lane-plugin/src"}

[tool.setuptools.packages.find]
where = ["plugins/evidence-lane-plugin/src"]

[tool.setuptools.package-data]
evidence_lane_plugin = [
  "schema.sql",
  "session_flash/env15/*.json",
  "session_flash/env15/*.md",
  "session_flash/env15/env/*",
  "session_flash/env15/uop/*",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["plugins/evidence-lane-plugin/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["plugins/evidence-lane-plugin/src/evidence_lane_plugin"]
